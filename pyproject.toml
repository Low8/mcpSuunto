[project]
name = "mcpSuunto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Louison Masson", email = "louison.masson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "fitdecode>=0.11.0",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
mcpSuunto = "mcpSuunto.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["N999"]

[tool.mypy]
ignore_missing_imports = true
